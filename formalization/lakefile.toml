name = "HTSIEFormalization"
version = "0.3.0"
defaultTargets = ["HTSIEFormalization"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "4.14.0"

[[lean_lib]]
name = "HTSIEFormalization"
srcDir = "."
globs = [
  "HTSIE.Foundations.StateSpace",
  "HTSIE.Foundations.Constraints",
  "HTSIE.Foundations.AccessibleStates",
  "HTSIE.Information.DFFI",
  "HTSIE.Information.SII",
  "HTSIE.Dimension.EDI",
  "HTSIE.Inequalities.HTSIEInequality",
  "HTSIE.SpectralFlow.SpectralDimension",
  "Theorems.Instability",
  "Theorems.ConstraintReduction",
  "Theorems.HTSIEInequality",
  "Counterexamples.SaturationNotInstability",
  "Applications.Chandrasekhar.Basic",
  "Applications.Chandrasekhar.EquationOfState",
  "Applications.Chandrasekhar.Polytrope",
  "Applications.Chandrasekhar.MassLimit",
  "Applications.Chandrasekhar.Main",
  "Applications.SAE.DFFI_SAE"
]
