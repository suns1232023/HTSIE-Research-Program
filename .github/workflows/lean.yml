```yaml
name: HTSIE Chandrasekhar Lean CI

on:
  push:
    branches: [ main ]
    paths:
      - 'formalization/**'
      - '.github/workflows/lean.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'formalization/**'

jobs:
  build:
    name: Lean 4 Build and Sorry Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Read Lean toolchain
        id: toolchain
        run: |
          TOOLCHAIN=$(cat formalization/lean-toolchain)
          echo "version=$TOOLCHAIN" >> $GITHUB_OUTPUT

      - name: Install Lean toolchain
        run: |
          elan toolchain install ${{ steps.toolchain.outputs.version }}
          elan default ${{ steps.toolchain.outputs.version }}

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: |
            formalization/.lake
            ~/.elan/toolchains
          key: ${{ runner.os }}-lean-${{ steps.toolchain.outputs.version }}-${{ hashFiles('formalization/lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-lean-${{ steps.toolchain.outputs.version }}-

      - name: Fetch Mathlib cache
        working-directory: formalization
        run: lake exe cache get || echo "Cache fetch failed, building from source"

      - name: Build formalization
        working-directory: formalization
        run: |
          lake build HTSIEChandrasekhar 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Sorry audit — FORMAL_VERIFIED files (must be 0)
        working-directory: formalization
        run: |
          echo "=== Sorry count in FORMAL_VERIFIED files ==="
          SORRY=0
          for f in Chandrasekhar/Basic.lean Chandrasekhar/EquationOfState.lean Chandrasekhar/Main.lean; do
            COUNT=$(grep -c "^[[:space:]]*sorry" "$f" 2>/dev/null || echo 0)
            echo "  $f: $COUNT"
            SORRY=$((SORRY + COUNT))
          done
          echo "Total sorry in FORMAL_VERIFIED files: $SORRY"
          if [ "$SORRY" -gt 0 ]; then
            echo "ERROR: sorry found in FORMAL_VERIFIED files"
            exit 1
          fi
          echo "PASS: 0 sorry in FORMAL_VERIFIED files"

      - name: Sorry audit — FORMAL_OPEN files (documented)
        working-directory: formalization
        run: |
          echo "=== Sorry count in FORMAL_OPEN files (expected) ==="
          for f in Chandrasekhar/Polytrope.lean Chandrasekhar/MassLimit.lean; do
            COUNT=$(grep -c "^[[:space:]]*sorry" "$f" 2>/dev/null || echo 0)
            echo "  $f: $COUNT sorry (FORMAL_OPEN — expected)"
          done

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-build-log
          path: formalization/build.log
