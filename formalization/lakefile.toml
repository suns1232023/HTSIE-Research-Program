name = "HTSIEFormalization"
version = "0.3.0"
defaultTargets = ["HTSIE", "Theorems", "Counterexamples", "Applications"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.14.0"

[[lean_lib]]
name = "HTSIE"
srcDir = "."
globs = [
  "HTSIE.Foundations.+",
  "HTSIE.Information.+",
  "HTSIE.Dimension.+"
]

[[lean_lib]]
name = "Theorems"
srcDir = "."
globs = ["Theorems.+"]

[[lean_lib]]
name = "Counterexamples"
srcDir = "."
globs = ["Counterexamples.+"]

[[lean_lib]]
name = "Applications"
srcDir = "."
globs = ["Applications.+"]
