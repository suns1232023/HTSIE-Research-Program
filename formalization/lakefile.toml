name = "HTSIEFormalization"
version = "0.2.0"
defaultTargets = ["HTSIEFormalization"]

[[require]]
name = "mathlib"
from = "git"
url = "https://github.com/leanprover-community/mathlib4"
rev = "v4.14.0"

[[lean_lib]]
name = "HTSIEFormalization"
globs = [
  "HTSIE/**",
  "Measures/**",
  "Theorems/**",
  "Counterexamples/**",
  "Applications/**"
]
