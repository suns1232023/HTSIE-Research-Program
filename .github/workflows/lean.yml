name: HTSIE Lean CI

on:
  push:
    branches:
      - main
    paths:
      - 'formalization/**'
      - '.github/workflows/lean.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'formalization/**'

jobs:
  debug:
    name: Debug — show actual file structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect directories
        working-directory: formalization
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Top-level contents ==="
          ls -la
          echo "=== All .lean files ==="
          find . -name "*.lean" | sort
          echo "=== HTSIE directory ==="
          find . -type d | sort

  build:
    name: Lean 4 Build and Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Read toolchain
        id: tc
        run: echo "version=$(cat formalization/lean-toolchain)" >> "$GITHUB_OUTPUT"

      - name: Install Lean toolchain
        run: |
          elan toolchain install "${{ steps.tc.outputs.version }}"
          elan default "${{ steps.tc.outputs.version }}"

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: |
            formalization/.lake
            ~/.elan/toolchains
          key: lean-${{ steps.tc.outputs.version }}-${{ hashFiles('formalization/lakefile.toml') }}
          restore-keys: lean-${{ steps.tc.outputs.version }}-

      - name: Fetch Mathlib cache
        working-directory: formalization
        run: lake exe cache get || true

      - name: Build
        working-directory: formalization
        run: lake build

      - name: Sorry audit — FORMAL_VERIFIED files (must be 0)
        working-directory: formalization
        run: |
          SORRY=0
          VERIFIED_FILES=(
            "HTSIE/Foundations/StateSpace.lean"
            "HTSIE/Foundations/Constraints.lean"
            "HTSIE/Foundations/AccessibleStates.lean"
            "HTSIE/Information/DFFI.lean"
            "HTSIE/Information/SII.lean"
            "HTSIE/Dimension/EDI.lean"
            "HTSIE/Inequalities/HTSIEInequality.lean"
            "HTSIE/SpectralFlow/SpectralDimension.lean"
            "Theorems/Instability.lean"
            "Theorems/ConstraintReduction.lean"
            "Theorems/HTSIEInequality.lean"
            "Counterexamples/SaturationNotInstability.lean"
            "Applications/SAE/DFFI_SAE.lean"
            "Applications/Chandrasekhar/Main.lean"
          )
          for f in "${VERIFIED_FILES[@]}"; do
            if [ -f "$f" ]; then
              N=$(grep -c "^[[:space:]]*sorry" "$f" || true)
              echo "$f: $N sorry"
              SORRY=$((SORRY + N))
            fi
          done
          echo "Total sorry in FORMAL_VERIFIED files: $SORRY"
          if [ "$SORRY" -gt 0 ]; then
            echo "FAIL: sorry found in FORMAL_VERIFIED files"
            exit 1
          fi
          echo "PASS: 0 sorry in FORMAL_VERIFIED files"

      - name: Sorry audit — FORMAL_OPEN files (informational)
        working-directory: formalization
        run: |
          OPEN_FILES=(
            "Applications/Chandrasekhar/Polytrope.lean"
            "Applications/Chandrasekhar/MassLimit.lean"
          )
          for f in "${OPEN_FILES[@]}"; do
            if [ -f "$f" ]; then
              N=$(grep -c "^[[:space:]]*sorry" "$f" || true)
              echo "$f: $N sorry [FORMAL_OPEN — expected and documented]"
            fi
          done

      - name: Generate status report
        working-directory: formalization
        run: |
          echo "=== HTSIE Formalization Status ===" > status_report.txt
          echo "Date: $(date -u)" >> status_report.txt
          echo "Lean: ${{ steps.tc.outputs.version }}" >> status_report.txt
          echo "" >> status_report.txt
          echo "Files built:" >> status_report.txt
          find . -name "*.lean" | sort >> status_report.txt
          cat status_report.txt

      - name: Upload status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formalization-status
          path: formalization/status_report.txt
          if-no-files-found: ignore
