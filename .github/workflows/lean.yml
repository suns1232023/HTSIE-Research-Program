name: HTSIE Lean CI

on:
  push:
    branches:
      - main
    paths:
      - 'formalization/**'
      - '.github/workflows/lean.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'formalization/**'

jobs:
  build:
    name: Lean 4 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Read toolchain
        id: tc
        run: echo "version=$(cat formalization/lean-toolchain)" >> "$GITHUB_OUTPUT"

      - name: Install Lean toolchain
        run: |
          elan toolchain install "${{ steps.tc.outputs.version }}"
          elan default "${{ steps.tc.outputs.version }}"

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: |
            formalization/.lake
            ~/.elan/toolchains
          key: lean-${{ steps.tc.outputs.version }}-${{ hashFiles('formalization/lakefile.toml') }}
          restore-keys: lean-${{ steps.tc.outputs.version }}-

      - name: Fetch Mathlib cache
        working-directory: formalization
        run: lake exe cache get || true

      - name: Build
        working-directory: formalization
        run: lake build HTSIEChandrasekhar

      - name: Sorry audit (FORMAL_VERIFIED files must have 0 sorry)
        working-directory: formalization
        run: |
          SORRY=0
          for f in Chandrasekhar/Basic.lean Chandrasekhar/EquationOfState.lean Chandrasekhar/Main.lean; do
            if [ -f "$f" ]; then
              N=$(grep -c "^[[:space:]]*sorry" "$f" || true)
              echo "$f: $N sorry"
              SORRY=$((SORRY + N))
            fi
          done
          echo "Total sorry in FORMAL_VERIFIED files: $SORRY"
          if [ "$SORRY" -gt 0 ]; then
            echo "FAIL: sorry found in FORMAL_VERIFIED files"
            exit 1
          fi
          echo "PASS"

      - name: Sorry audit (FORMAL_OPEN files — informational)
        working-directory: formalization
        run: |
          for f in Chandrasekhar/Polytrope.lean Chandrasekhar/MassLimit.lean; do
            if [ -f "$f" ]; then
              N=$(grep -c "^[[:space:]]*sorry" "$f" || true)
              echo "$f: $N sorry [FORMAL_OPEN — expected]"
            fi
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: formalization/build.log
          if-no-files-found: ignore
