name: Daily HTSIE Automated Pipeline

on:
  schedule:
    # 每天 UTC 零点（北京时间 08:00）自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 界面手动一键触发

jobs:
  run-daily-task:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 配置 Python 环境
      - name: Set up Python
        uses: actions/checkout@v4
        with:
          python-version: '3.10'

      # 3. 缓存 Python 依赖（加速每日构建）
      - name: Cache Pip Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. 安装依赖
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      # 5. 执行每日计算/任务脚本
      - name: Execute Daily Task
        env:
          # 如果涉及 API Key 或 Token，在此处引入（需在 GitHub Repo Settings -> Secrets 中设置）
          OPENXLAB_TOKEN: ${{ secrets.OPENXLAB_TOKEN }}
        run: |
          python scripts/daily_runner.py

      # 6. 自动将更新内容（如新数据、生成报告）Commit 并 Push 回 GitHub
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: daily HTSIE task update [skip ci]"
          branch: main
          file_pattern: 'data/* experiments/* *.html'
