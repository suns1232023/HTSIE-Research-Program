
name: Daily HTSIE Task Update

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00 自动运行
  workflow_dispatch:        # 支持手动触发

jobs:
  auto-commit-job:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run HTSIE Daily Pipeline
        env:
          OPENXLAB_TOKEN: ${{ secrets.OPENXLAB_TOKEN }}
        run: |
          python scripts/daily_runner.py

      - name: Auto-commit updated metrics and logs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: daily HTSIE task update [skip ci]"
          branch: main
          file_pattern: "data/metrics.json data/daily_log.md"
          commit_author: "suns1232023 <145432766+suns1232023@users.noreply.github.com>"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
